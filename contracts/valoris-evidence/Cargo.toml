[package]
name = "valoris-evidence"
version = "0.1.0"
edition = "2021"
rust-version = "1.84.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

# Guarantees this crate is its own workspace root (true isolation).
[workspace]

[dependencies]
soroban-sdk = "30"

[dev-dependencies]
soroban-sdk = { version = "30", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
